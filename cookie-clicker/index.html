<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cookie.exe</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>

body {
  background: #050608;
  color: #e8f2ff;
  margin: 0;
  padding: 40px 16px 80px;
  font-family: 'VT323', monospace;
  font-size: 20px;
}

.wrap {
  max-width: 640px;
  margin: 0 auto;
}

.header-box {
  white-space: pre;
  font-size: 16px;
  margin-bottom: 20px;
  opacity: 0.9;
}

.stats {
  border: 1px solid #e8f2ff44;
  padding: 10px 14px;
  margin-bottom: 18px;
}

.stats div { margin: 2px 0; }
#cps { opacity: 0.7; }

.cookie-btn {
  display: block;
  width: 100%;
  background: none;
  border: 1px solid #e8f2ff88;
  color: #e8f2ff;
  font-size: 64px;
  line-height: 1;
  text-align: center;
  padding: 18px 0;
  cursor: pointer;
  margin-bottom: 6px;
}

.cookie-btn:hover { background: #e8f2ff; color: #050608; }
.cookie-btn:active { transform: translateY(1px); }

.hint {
  text-align: center;
  font-size: 14px;
  opacity: 0.5;
  margin-bottom: 26px;
}

.shop-label {
  margin-bottom: 6px;
  opacity: 0.8;
}

.item {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 16px;
  padding: 6px 10px;
  margin: 2px 0;
  border: 1px dashed #e8f2ff33;
  text-decoration: none;
  color: #e8f2ff;
  cursor: pointer;
}

.item:hover:not(.disabled) { background: #e8f2ff; color: #050608; }
.item:hover:not(.disabled) .idesc { opacity: 1; }

.item.disabled { opacity: 0.35; cursor: default; }

.iname { flex: 0 0 110px; }
.idesc { flex: 1 1 220px; opacity: 0.6; }
.iowned { flex: 0 0 70px; text-align: right; opacity: 0.7; }
.icost { flex: 0 0 90px; text-align: right; }

@media (max-width: 500px) {
  .idesc { flex-basis: 100%; order: 3; }
}

.footer {
  margin-top: 26px;
  font-size: 14px;
  opacity: 0.45;
}

</style>
</head>
<body>

<div class="wrap">

  <div class="header-box">====================================
  COOKIE.EXE
====================================</div>

  <div class="stats">
    <div id="cookieCount">&gt; 0 cookies</div>
    <div id="cps">&gt; 0.00 cookies/sec</div>
  </div>

  <button class="cookie-btn" id="cookieBtn">🍪</button>
  <div class="hint">click it. thats the whole game.</div>

  <div class="shop-label">&gt; buy stuff</div>
  <div class="shop" id="shop"></div>

  <div class="footer">autosaves to localStorage every few seconds, refresh away</div>
</div>

<script>

var SAVE_KEY = "cookieClickerSave";

var COST_SCALE = 1.15;

var items = [
  { id: "grandma", name: "grandma",  desc: "bakes 1 cookie every 15s", baseCost: 50,   cps: 1 / 15, owned: 0 },
  { id: "bakery",  name: "bakery",   desc: "bakes 1 cookie every 10s", baseCost: 200,  cps: 1 / 10, owned: 0 },
  { id: "farm",    name: "farm",     desc: "bakes 1 cookie every 5s",  baseCost: 1000, cps: 1 / 5,  owned: 0 },
  { id: "factory", name: "factory",  desc: "bakes 1 cookie every 2s",  baseCost: 5000, cps: 1 / 2,  owned: 0 }
];

var cookies = 0;

function $(id) { return document.getElementById(id); }

function costOf(item) {
  return Math.ceil(item.baseCost * Math.pow(COST_SCALE, item.owned));
}

function totalCps() {
  var total = 0;
  for (var i = 0; i < items.length; i++) total += items[i].cps * items[i].owned;
  return total;
}

function fmt(n) {
  return Math.floor(n).toLocaleString();
}

function render() {
  $("cookieCount").textContent = "> " + fmt(cookies) + " cookies";
  $("cps").textContent = "> " + totalCps().toFixed(2) + " cookies/sec";

  var shop = $("shop");
  shop.innerHTML = "";
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    var cost = costOf(item);
    var afford = cookies >= cost;

    var row = document.createElement("div");
    row.className = "item" + (afford ? "" : " disabled");
    row.innerHTML =
      '<span class="iname">&gt; ' + item.name + '</span>' +
      '<span class="idesc">' + item.desc + '</span>' +
      '<span class="iowned">x' + item.owned + '</span>' +
      '<span class="icost">' + fmt(cost) + ' ck</span>';

    row.addEventListener("click", (function (item) {
      return function () { buy(item); };
    })(item));

    shop.appendChild(row);
  }
}

function buy(item) {
  var cost = costOf(item);
  if (cookies < cost) return;
  cookies -= cost;
  item.owned++;
  render();
  save();
}

$("cookieBtn").addEventListener("click", function () {
  cookies += 1;
  render();
});

function save() {
  var data = { cookies: cookies, items: {} };
  for (var i = 0; i < items.length; i++) data.items[items[i].id] = items[i].owned;
  localStorage.setItem(SAVE_KEY, JSON.stringify(data));
}

function load() {
  var raw = localStorage.getItem(SAVE_KEY);
  if (!raw) return;
  try {
    var data = JSON.parse(raw);
    cookies = data.cookies || 0;
    for (var i = 0; i < items.length; i++) {
      items[i].owned = (data.items && data.items[items[i].id]) || 0;
    }
  } catch (e) {
    console.log("save load failed", e);
  }
}

var lastTick = Date.now();
setInterval(function () {
  var now = Date.now();
  var dt = (now - lastTick) / 1000;
  lastTick = now;
  cookies += totalCps() * dt;
  render();
}, 1000);

setInterval(save, 5000);
window.addEventListener("beforeunload", save);

load();
render();

</script>

</body>
</html>
